services:
  postgres:
    image: postgres:16-alpine
    container_name: starwars-films-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starwars
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d starwars']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
